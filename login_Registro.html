<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login/Registro</title>
  <style>
    body {
      text-align: center;
    }
    table {
      margin: 0 auto; text-align: left;
    }
    td {
      font: bold 20px verdana, sans-serif;
    }
    textarea{
      font: normal 15px verdana, sans-serif;
      margin: 20px;
      vertical-align: middle;
      resize: none;
    }
    #main_menu {
      border-bottom: 2px solid #cccccc;
      width: 800px;
      margin: 0 auto; /* Centrar el menú horizontalmente */
      margin-bottom: 30px;
    }
    #main_menu li {
      display: inline-block;
      list-style: none;
      padding: 25px;
      font: bold 15px verdana, sans-serif;
    }
    #main_menu ul {
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
<h1>Registro de Usuario</h1>
<nav id="main_menu" >
  <ul>
    <li>Iniciar Sesión</li>
    <li>Crear Cuenta</li>
    <li>Reinicializar Contraseña</li>
  </ul>
</nav>
<table>
  <tr>
    <td>Nombre:</td>
    <td><textarea id="nombre" name="nombre" rows="1" cols="30"></textarea></td>
  </tr>
  <tr>
    <td>Apellidos:</td>
    <td><textarea id="apellidos" name="apellidos" rows="1" cols="30"></textarea></td>
  </tr>
  <tr>
    <td>Fecha de Nacimiento:</td>
    <td><input type="date" id="fecha_nacimiento" name="fecha_nacimiento" style="font-size: 15px; margin-left: 20px;"></td>
  </tr>
  <tr>
    <td>DNI:</td>
    <td><textarea id="dni" name="dni" rows="1" cols="30"></textarea></td>
  </tr>
  <tr>
    <td>Dirección:</td>
    <td><textarea id="direccion" name="direccion" rows="1" cols="30"></textarea></td>
  </tr>
  <tr>
    <td>Teléfono:</td>
    <td><textarea id="telefono" name="telefono" rows="1" cols="30"></textarea></td>
  </tr>
  <tr>
    <td>Correo:</td>
    <td><input type="email" id="correo" name="correo" style="font-size: 14px; margin:20px; width: 280px;"></td>
  </tr>
  <tr>
    <td>Contraseña:</td>
    <td><textarea id="contrasena" name="contrasena" rows="1" cols="30"></textarea></td>
  </tr>
</table>
<br><input type="button" value="Confirmar" style="font-size: 20px; padding:  15px 30px;" ></br>
</body>
</html>
