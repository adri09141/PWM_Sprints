<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/estilos.css">
  <link rel="stylesheet" href="assets/css/estilos-acceso.css">
  <script src="assets/js/xlu-include-file.js"></script>
  <script src="assets/js/auth.js"></script>
  <title>Registro de Usuario</title>
</head>

<body style="text-align: center;">

  <header id = "header"></header>

  <h1>Registro de Usuario</h1>
  <nav class="main_menu">
    <ul>
      <li><a href="iniciarSension.html" class="enlace-nav">Iniciar Sesión</a></li>
      <li>Crear Cuenta</li>
    </ul>
  </nav>

  <form id = "formulario_registro">
    <table class="tabla-acceso">
      <tr>
        <td>Nombre:</td>
        <td><input type="text" id="nombre" name="nombre" required minlength="2"
            style="width: 280px; font-size: 14px; margin: 5px;"></td>
      </tr>
      <tr>
        <td>Apellidos:</td>
        <td><input type="text" id="apellidos" name="apellidos" required minlength="2"
            style="width: 280px; font-size: 14px; margin: 5px;"></td>
      </tr>
      <tr>
        <td>Fecha de Nacimiento:</td>
        <td>
          <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required style="font-size: 15px; margin-left: 20px;">

          <div id="mensaje_error" style="color: red; display: none; margin-left: 20px; margin-top: 5px; font-size: 14px;"></div>
        </td>
      </tr>
      <tr>
        <td>DNI:</td>
        <td><input type="text" id="dni" name="dni" required pattern="\d{8}[a-zA-Z]"
            title="Debe contener 8 dígitos y 1 letra" style="width: 280px; font-size: 14px; margin: 5px;"></td>
      </tr>
      <tr>
        <td>Dirección:</td>
        <td><input type="text" id="direccion" name="direccion" required
            style="width: 280px; font-size: 14px; margin: 5px;"></td>
      </tr>
      <tr>
        <td>Teléfono:</td>
        <td><input type="tel" id="telefono" name="telefono" required pattern="\d{9}" title="Debe contener 9 números"
            style="width: 280px; font-size: 14px; margin: 5px;"></td>
      </tr>
      <tr>
        <td>Correo:</td>
        <td><input type="email" id="correo" name="correo" required placeholder="ejemplo@gmail.com"
            style="width: 280px; font-size: 14px; margin: 5px;"></td>
      </tr>
      <tr>
        <td>Contraseña:</td>
        <td><input type="password" id="contrasena" name="contrasena" required minlength="4"
            style="width: 280px; font-size: 14px; margin: 5px;"></td>
      </tr>
    </table>

    <br>

    <button type="submit" style="font-size: 20px; padding: 15px 30px;" class="botonPrincipal">Crear</button>
  </form>

  <footer id = "footer"></footer>

  <script>
    xLuIncludeFile();
    document.addEventListener('DOMContentLoaded', (event) => {
      loadHTMLAndExecuteScripts('#header', 'components/_header.html');
      loadHTMLAndExecuteScripts('#footer', 'components/_footer.html');
    });
  </script>

</body>

</html>
