<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/estilos.css">
  <link rel="stylesheet" href="assets/css/pages/acceso.css">
  <script src="assets/js/xlu-include-file.js"></script>
  <title>Reiniciar Contraseña</title>
</head>

<body style="text-align: center;">

<header id = "header"></header>

<h1>Reiniciar Contraseña</h1>

<nav class="main_menu">
  <ul>
    <li>Reinicializar Contraseña</li>
    <li><a href="perfil.html" class="enlace-nav">Datos</a></li>
    <li><a href="adoptados.html" class="enlace-nav">Adoptados</a></li>
  </ul>
</nav>

<table class="tabla-acceso">
  <tr>
    <td>Contraseña Actual:</td>
    <td><input type="password" id="contrasena_actual" name="contrasena_actual" required minlength="4">
      <button type="button" id="btn_ver_contrasena1" style="cursor: pointer; padding: 5px;">Ver</button>
      <div id="mensaje_error2" style="color: red; display: none; margin-top: 5px; font-size: 14px; text-align: left;"></div>
    </td>
  </tr>
  <tr>
    <td>Nueva Contraseña:</td>
    <td>
      <input type="password" id="contrasena" name="contrasena">
      <button type="button" id="btn_ver_contrasena2" style="cursor: pointer; padding: 5px;">Ver</button>
      <div id="error_contrasena" style="color: red; display: none; margin-top: 5px; font-size: 14px; text-align: left;"></div>
    </td>
  </tr>
  <tr>
    <td>Repetir Contraseña:</td>
    <td>
      <input type="password" id="contrasena_nueva2" name="contrasena_nueva2">
      <div id="mensaje_error" style="color: red; display: none; margin-top: 5px; font-size: 14px; text-align: left;"></div>
    </td>
  </tr>
</table>

<br>

<input type="button" id="btn_confirmar" value="Confirmar" style="font-size: 20px; padding: 15px 30px;">

<footer id = "footer"></footer>

<script>
  xLuIncludeFile();
  document.addEventListener('DOMContentLoaded', (event) => {
    loadHTMLAndExecuteScripts('#header', 'components/_header.html');
    loadHTMLAndExecuteScripts('#footer', 'components/_footer.html');
  });
</script>
<script src="assets/js/validar-contrasena.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
