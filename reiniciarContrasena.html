<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/estilos.css">
  <link rel="stylesheet" href="assets/css/pages/acceso.css">
  <script src="assets/js/xlu-include-file.js"></script>
  <title>Reiniciar Contraseña — Huellas Felices</title>
</head>

<body>

<header id="header"></header>

<main class="pagina-acceso">

  <!-- Panel izquierdo decorativo -->
  <div class="acceso-panel-izq">
    <p class="panel-tag">Seguridad de tu cuenta</p>
    <h1 class="panel-titulo">Mantén tu<br>cuenta <em>segura</em></h1>
    <p class="panel-descripcion">
      Actualiza tu contraseña regularmente para proteger tu cuenta y la información de tus solicitudes de adopción.
    </p>
    <div class="panel-mascotas">
      <div class="mascota-chip"><span>🔒</span> Privacidad</div>
      <div class="mascota-chip"><span>🛡️</span> Seguridad</div>
    </div>
  </div>

  <!-- Panel derecho con formulario -->
  <div class="acceso-panel-der">
    <div class="acceso-card">

      <!-- Tabs de perfil -->
      <nav class="acceso-tabs">
        <span class="acceso-tab activo">Contraseña</span>
        <a href="perfil.html" class="acceso-tab">Mis Datos</a>
        <a href="adoptados.html" class="acceso-tab">Adoptados</a>
      </nav>

      <h2 class="acceso-titulo">Cambiar contraseña</h2>
      <p class="acceso-subtitulo">Introduce tu contraseña actual y la nueva que quieres usar.</p>

      <div class="campo-grupo">
        <label class="campo-label" for="contrasena_actual">Contraseña actual</label>
        <div class="campo-wrapper">
          <input class="campo-input" type="password" id="contrasena_actual" name="contrasena_actual"
                 required minlength="4" placeholder="Tu contraseña actual">
          <button type="button" id="btn_ver_contrasena1" class="btn-ver-pass">Ver</button>
        </div>
        <div id="mensaje_error2" class="acceso-error" style="margin-top: 20px"></div>
      </div>

      <div class="campo-grupo">
        <label class="campo-label" for="contrasena">Nueva contraseña</label>
        <div class="campo-wrapper">
          <input class="campo-input" type="password" id="contrasena" name="contrasena"
                 placeholder="Mínimo 3 caracteres, 1 número y 1 un caracter especial">
          <button type="button" id="btn_ver_contrasena2" class="btn-ver-pass">Ver</button>
        </div>
        <div id="error_contrasena" class="acceso-error" style="margin-top: 20px"></div>
      </div>

      <div class="campo-grupo">
        <label class="campo-label" for="contrasena_nueva2">Repetir nueva contraseña</label>
        <div class="campo-wrapper">
          <input class="campo-input" type="password" id="contrasena_nueva2" name="contrasena_nueva2"
                 placeholder="Repite la nueva contraseña">
        </div>
        <div id="mensaje_error" class="acceso-error" style="margin-top: 20px"></div>
      </div>

      <button type="button" id="btn_confirmar" class="btn-acceso-principal">
        Confirmar cambio
      </button>

    </div>
  </div>

</main>

<footer id="footer"></footer>

<script>
  xLuIncludeFile();
  document.addEventListener('DOMContentLoaded', () => {
    loadHTMLAndExecuteScripts('#header', 'components/_header.html');
    loadHTMLAndExecuteScripts('#footer', 'components/_footer.html');
  });
</script>
<script src="assets/js/validar-contrasena.js"></script>
<script src="assets/js/auth.js"></script>

</body>
</html>
