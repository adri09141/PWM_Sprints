<article class="tarjeta-resena">
  <div class="tarjeta-resena__cuerpo">
    <div class="estrellas">
      <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
    </div>
    <h2 class="titulo">{{resenas.titulo}}</h2>
    <p class="texto">{{resenas.resena}}</p>
  </div>

  <div class="imagen-reseña">
    <img [src]="resenas.foto" alt="Foto de {{resenas.nombre_perro}}">
  </div>
</article>
