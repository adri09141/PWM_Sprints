<section class="catalogo-hero">
  <div class="hero-texto">
    <span class="hero-tag">Encuentra a tu compañero</span>
    <h1 class="hero-titulo">Cada uno espera<br>un hogar como el <em>tuyo</em></h1>
    <p class="hero-descripcion">
      Todos merecen una segunda oportunidad. Explora nuestro catálogo y encuentra al compañero perfecto para tu vida.
    </p>
  </div>
  <div class="hero-stats">
    <div class="hero-stat">
      <span class="hero-stat-num" id="statTotal">{{ animales().length }}</span>
      <span class="hero-stat-label">Disponibles hoy</span>
    </div>
  </div>
</section>

<!-- Tarjetas -->
<div class="catalogo-seccion">
  <div class="catalogo-seccion-header">
    <span class="catalogo-seccion-titulo">En adopción</span>
    <div class="catalogo-seccion-linea"></div>
  </div>

  <form id="boton_filtro">
    <div class="campo-grupo">
      <label class="campo-label" for="boton_filtro">Filtro</label>
      <div class="campo-wrapper">
        <select class="campo-input" id="filtro" name="filtro" required>
          <option value="Todos" selected>Todos los animales</option>
          <option value="Perro">Perro</option>
          <option value="Gato">Gato</option>
          <option value="Conejo">Conejo</option>
        </select>
      </div>
    </div>
  </form>

  <div class="grupo-tarjetas">
    <section class="grid-contenedor" id="tarjetaAnimal">
      @for (item of animales(); track item.id) {
        <app-tarjeta-animal [animal]="item"></app-tarjeta-animal>
      }
    </section>
  </div>
</div>
