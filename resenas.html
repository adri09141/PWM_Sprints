<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reseñas de Adoptantes</title>
  <link rel="stylesheet" href="assets/css/estilos.css">
  <link rel="stylesheet" href="assets/css/components/botones.css">
    <link rel="stylesheet" href="assets/css/components/tarjeta-resena.css">
  <script src="assets/js/xlu-include-file.js"></script>
  <script src="assets/js/auth.js"></script>
</head>

<body>
  <header id="header"></header>
  <h2 class="titulo-apartado">Lo que dicen nuestros adoptantes</h2>
  <a href="anadirResena.html" class="enlace-nav">
    <button class="boton-ver-mas"> Añadir Reseña</button>
  </a>

  <div class="grupo-tarjetas-resenas">

    <section class="grid-contenedor" id="tarjetaResena"></section>
  </div>
  <footer id="footer"></footer>
  <script>xLuIncludeFile();</script>

  <script>
    document.addEventListener('DOMContentLoaded', (event) => {
      loadHTMLAndExecuteScripts('#header', 'components/_header.html');
      loadHTMLAndExecuteScripts('#footer', 'components/_footer.html');
      cargarContenidoDinamico();
    });
    let btn_anadir_resena = document.getElementById('btn_anadir_resena');
    if(btn_anadir_resena)
    {
      btn_anadir_resena.addEventListener('click', (event) => {
        if (!verificarRegistro()) {
          event.preventDefault();
          alert("¡Hola! Para contar tu historia, primero debes iniciar sesión. 🐾");
          window.location.href = "iniciarSension.html";
        }
      })
    }
  </script>
</body>

</html>
