<article class="tarjeta-resena">
    <h2 class="titulo">{{titulo}}</h2>
    <p class="texto">{{reseña}}</p>

    <div class="imagen-reseña">
        <span class="nombre-animal-reseña">{{nombre_perro}}</span>
        <div class="foto-reseña">
            <img src="{{foto_perro}}" alt="Foto de {{nombre_perro}}">
        </div>
    </div>
</article>
