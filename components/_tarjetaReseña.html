<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <link rel="stylesheet" href="assets/css/estilos.css">
    <style>
        figure {
            margin: 0; 
            padding: 0;
            text-align: center;
            display: flex;
            align-items: center;
            font: bold 15px verdana, sans-serif;
        }
        figcaption {
            margin-right: 10px;
        }
        h2 {
            font: normal 30px verdana;
            text-align: center;
        }
        h3 {
            font: normal 15px verdana, sans-serif;
        }
    </style>
</head>
<body>

<main class="main-catalogo">
    <article class="contenedor">
        <h2>{{titulo}}</h2>
        <h3>{{reseña}}</h3>
        <figure>
            <figcaption>{{nombre_perro}}</figcaption>
            <img src="https://placehold.co/250x250?text=FOTO+1" alt="Foto 1">
        </figure>
    </article>
</main>

</body>
</html>
