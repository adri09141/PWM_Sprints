<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Refugio</title>
    <link rel="stylesheet" href="assets/css/estilos.css">
    <link rel="stylesheet" href="assets/css/home.css">
    <script src="assets/js/xlu-include-file.js"></script>

    <style>
        main {
            display: flex;
            flex-direction: column;
            gap: 20px; /* Separación entre las secciones grandes */
        }

    </style>
</head>
<body>

<header xlu-include-file="components/_header.html"></header>

<main>

    <section class="seccionPrincipal">
        <h1>Nombre de la web</h1>
        <p>Frase de la web</p>
        <div class="botonesSeccionPrincipal">
            <button class="botonPrincipal">Registro</button>
            <button class="botonPrincipal">Catálogo</button>
        </div>
    </section>

    <h2 class="titulo-apartado">Animales:</h2>
    <section class="grid-contenedor">
        <div xlu-include-file="components/_tarjetaAnimal.html"></div>
        <div xlu-include-file="components/_tarjetaAnimal.html"></div>
        <div xlu-include-file="components/_tarjetaAnimal.html"></div>
    </section>
    <button class="boton-saber-mas">Ver más</button>

    <section class="animalesAdoptados">
        <h2>Vidas salvadas</h2>
        <div class="contenedor-contador">
            <div class="caja-numero">X</div>
            <div class="caja-numero">X</div>
            <div class="caja-numero">X</div>
            <div class="caja-numero">X</div>
            <div class="caja-numero">X</div>
        </div>
        <p>Frase conmovedora</p>
        <button class="botonSaberMas">Saber más</button>
    </section>

    <h2 class="titulo-apartado">Reseñas:</h2>
    <section class="grid-contenedor">
        <div xlu-include-file="components/_tarjetaReseña.html"></div>
        <div xlu-include-file="components/_tarjetaReseña.html"></div>
        <div xlu-include-file="components/_tarjetaReseña.html"></div>
    </section>
    <button class="boton-saber-mas">Ver más</button>
</main>

<footer xlu-include-file="components/_footer.html"></footer>

<script>xLuIncludeFile();</script>

</body>
</html>
