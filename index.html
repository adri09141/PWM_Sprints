<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Refugio</title>
    <link rel="stylesheet" href="assets/css/estilos.css">
    <script src="assets/js/xlu-include-file.js"></script>

    <style>
        main {
            display: flex;
            flex-direction: column; /* Obliga a los hijos a ponerse uno debajo del otro */
            gap: 50px; /* Crea una separación perfecta de 50px entre catálogo y reseñas */
            padding: 20px; /* Un poco de aire a los lados */
        }

        section {
            width: 100%;
            clear: both; /* Evita que se peguen a los elementos de arriba */
            overflow: hidden; /* Truco ninja para "encerrar" a los animales flotantes */
        }
    </style>
</head>
<body>

<header xlu-include-file="components/_header.html"></header>

<main>
    <div xlu-include-file="catalogo.html"></div>

    <section xlu-include-file="reseñas.html"></section>
    <section xlu-include-file="fichaAnimal.html"></section>
</main>

<footer xlu-include-file="components/_footer.html"></footer>

<script>xLuIncludeFile();</script>

</body>
</html>
