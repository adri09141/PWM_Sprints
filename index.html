<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mi Refugio</title>
    <link rel="stylesheet" href="assets/css/estilos.css">
    <link rel="stylesheet" href="assets/css/pages/home.css">
    <link rel="stylesheet" href="assets/css/components/tarjeta-animal.css">
    <link rel="stylesheet" href="assets/css/components/tarjeta-resena.css">
    <link rel="stylesheet" href="assets/css/components/contador.css">
    <script src="assets/js/xlu-include-file.js"></script>

    <style>
        main {
            display: flex;
            flex-direction: column;
            gap: 20px;
            /* Separación entre las secciones grandes */
        }
    </style>
</head>

<body>
    <header id="header"> </header>
    <main>
        <section class="seccionPrincipal">
            <h1>Nombre de la web</h1>
            <p>Frase de la web</p>
            <div class="botonesSeccionPrincipal">
                <a href="crearCuenta.html" class="enlace-nav">
                    <button class="botonRegitrarse">Registro</button>
                </a>
                <a href="catalogo.html" class="enlace-nav">
                    <button class="botonCatalogo">Catálogo</button>
                </a>
            </div>
        </section>

        <div class="muestra-catalogo">
            <h2 class="titulo-apartado">Animales</h2>
            <div class="grupo-tarjetas">
                <section class="grid-contenedor" id="tarjetaAnimal"></section>
            </div>
            <a href="catalogo.html" class="enlace-nav">
                <button class="boton-ver-mas">
                    Ver mas
                    <div class="icon">
                        <svg
                                height="24"
                                width="24"
                                viewBox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg"
                        >
                            <path d="M0 0h24v24H0z" fill="none"></path>
                            <path
                                    d="M16.172 11l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2z"
                                    fill="currentColor"
                            ></path>
                        </svg>
                    </div>
                </button>
            </a>
        </div>

        <section class="animalesAdoptados">
            <p class="etiqueta-contador">Desde nuestros inicios</p>
            <h2>Vidas salvadas</h2>
            <div id="contenedorContador"></div>
            <p class="subtexto-contador">animales adoptados y contando</p>
        </section>

        <div class="muestra-reseñas">
            <h2 class="titulo-apartado">Reseñas</h2>
            <section class="grid-contenedor" id="tarjetaResena"></section>
            <a href="resenas.html" class="enlace-nav">
                <button class="boton-ver-mas">
                    Ver mas
                    <div class="icon">
                        <svg
                                height="24"
                                width="24"
                                viewBox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg"
                        >
                            <path d="M0 0h24v24H0z" fill="none"></path>
                            <path
                                    d="M16.172 11l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2z"
                                    fill="currentColor"
                            ></path>
                        </svg>
                    </div>
                </button>
            </a>
        </div>

        <footer id="footer"> </footer>
    </main>


    <script>xLuIncludeFile();</script>

    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            loadHTMLAndExecuteScripts('#header', 'components/_header.html');
            loadHTMLAndExecuteScripts('#footer', 'components/_footer.html');
            cargarContenidoDinamico(3);
        });
    </script>

</body>

</html>
