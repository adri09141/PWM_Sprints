<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/estilos.css">
    <script src="assets/js/xlu-include-file.js"></script>
    <title>Adopción</title>
    <style>
        h1 {
            font: bold 40px verdana, sans-serif;
        }
        body {
            text-align: center;
        }
        textarea
        {
            font: normal 15px verdana, sans-serif;
            margin: 20px;
            vertical-align: middle;
            resize: none;
        }
    </style>
</head>

<body>
    <header id = "header"></header>
    <form id="formulario_adopcion">
        <h1><label for="mensaje">¿Por qué quieres adoptar?</label></h1>
        <textarea id="mensaje" name="mensaje" rows="8" cols="120" required minlength="4"></textarea><br><br>

        <button type="submit" style="font-size: 20px; padding: 15px 30px; " class="botonPrincipal" id = "enviar">Enviar</button>
    </form>
    <footer id = "footer"></footer>
</body>
<script>xLuIncludeFile();</script>
<script>
    document.addEventListener('DOMContentLoaded', (event) => {
        loadHTMLAndExecuteScripts('#header', 'components/_header.html');
        loadHTMLAndExecuteScripts('#footer', 'components/_footer.html');
    });
    const formAdopcion = document.getElementById('formulario_adopcion');
    let usuarioMemoria = JSON.parse(localStorage.getItem('usuarioLogueado'));
    if(!usuarioMemoria) {alert("Debe iniciar sension");}
    if (formAdopcion && usuarioMemoria ) {
        formAdopcion.addEventListener('submit', function(e) {
            e.preventDefault(); // Evitamos que la página se recargue sola
            let btnEnviar = document.getElementById('enviar');
            btnEnviar.style.backgroundColor = '#4CAF50';
            btnEnviar.style.color = 'white';
            btnEnviar.textContent = "Enviando.. ✅";
            btnEnviar.disabled = true;

            setTimeout(() => {
                window.location.href = "index.html";
            }, 1000);
        });
    }
</script>
</html>
