<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer</title>
</head>
<body>

<footer class="main-footer">
    <div class="contenedor-footer">
        <!-- Logo y nombre del sitio -->
        <div class="footer-brand">
            <a href="/" class="footer-logo" aria-label="Inicio">
                <img src="ruta-del-logo.png" alt="Logo de la web" class="logo-img">
                <span class="web-name">Nombre de la web</span>
            </a>
        </div>

        <!-- Navegación del footer -->
        <nav class="footer-nav">
            <ul>
                <li><a href="/">Inicio</a></li>
                <li><a href="/adoptar">Quiero adoptar</a></li>
                <li><a href="/sobre-nosotros">Sobre nosotros</a></li>
                <li><a href="/finales-felices">Finales felices</a></li>
            </ul>
        </nav>

        <!-- Redes sociales -->
        <div class="footer-social" aria-label="Redes sociales">
            <a href="#" aria-label="Facebook">
                <img src="img/facebook.png" alt="Facebook" class="social-icon">
            </a>
            <a href="#" aria-label="Instagram">
                <img src="img/instagram.png" alt="Instagram" class="social-icon">
            </a>
            <a href="#" aria-label="Twitter">
                <img src="img/twitter.png" alt="Twitter" class="social-icon">
            </a>
            <a href="#" aria-label="YouTube">
                <img src="img/youtube.png" alt="YouTube" class="social-icon">
            </a>
        </div>

    </div>
</footer>

</body>
</html>
