<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Template Footer</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<footer class="main-footer">
    <div class="contenedor-footer">
        <div class="footer-brand">
            <a href="/" class="footer-logo">
                <img src="../img/Logo.png" alt="Logo de la web">
                <span class="web-name">Nombre de la web</span>
            </a>
        </div>

        <nav class="footer-nav">
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Quiero adoptar</a></li>
                <li><a href="#">Sobre nosotros</a></li>
                <li><a href="#">Finales felices</a></li>
            </ul>
        </nav>

        <div class="footer-social">
            <a href="#" class="social-link"><img src="../img/facebook.png" alt="Facebook" class="icono-social"></a>
            <a href="#" class="social-link"><img src="../img/instagram.png" alt="Instagram" class="icono-social"></a>
            <a href="#" class="social-link"><img src="../img/twitter.png" alt="Twitter" class="icono-social"></a>
            <a href="#" class="social-link"><img src="../img/youtube.png" alt="YouTube" class="icono-social"></a>
        </div>
    </div>
</footer>

</body>
</html>
