<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Adoptados — Huellas Felices</title>
  <link rel="stylesheet" href="assets/css/estilos.css">
  <link rel="stylesheet" href="assets/css/pages/acceso.css">
  <link rel="stylesheet" href="assets/css/components/tarjeta-animal.css">
  <script src="assets/js/xlu-include-file.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #F5EFE6; font-family: 'DM Sans', sans-serif; }

    .pagina-adoptados {
      min-height: calc(100vh - 72px);
      display: flex;
    }

    /* ── Panel izquierdo ── */
    .adoptados-panel-izq {
      width: 42%; flex-shrink: 0;
      background-color: #1A1A2E;
      background-image:
              radial-gradient(ellipse 80% 60% at 30% 20%, rgba(200,149,108,0.15) 0%, transparent 60%),
              radial-gradient(ellipse 60% 50% at 70% 80%, rgba(123,158,135,0.1) 0%, transparent 60%);
      display: flex; flex-direction: column;
      justify-content: center; align-items: flex-start;
      padding: 60px 52px;
      position: relative; overflow: hidden;
    }

    .adoptados-panel-izq::after {
      content: '';
      position: absolute; top: 0; right: 0;
      width: 3px; height: 100%;
      background: linear-gradient(to bottom, transparent, #C8956C 30%, #7B9E87 70%, transparent);
      opacity: 0.5;
    }

    .adoptados-panel-izq::before {
      content: '';
      position: absolute; bottom: -60px; right: -60px;
      width: 300px; height: 300px; border-radius: 50%;
      border: 40px solid rgba(200,149,108,0.06); pointer-events: none;
    }

    .panel-tag { font-size:10px;letter-spacing:0.35em;text-transform:uppercase;color:#C8956C;margin-bottom:24px;font-weight:400; }
    .panel-titulo { font-family:'Playfair Display',serif;font-size:clamp(28px,3.5vw,44px);font-weight:700;color:#F5F0E8;line-height:1.15;margin:0 0 20px 0;letter-spacing:-0.02em; }
    .panel-titulo em { font-style:italic;color:#C8956C; }
    .panel-descripcion { font-size:14px;font-weight:300;line-height:1.75;color:rgba(245,240,232,0.55);max-width:300px;margin:0 0 44px 0; }

    /* Stat chips */
    .panel-stats { display:flex;flex-direction:column;gap:14px; }
    .stat-item { display:flex;align-items:center;gap:14px; }
    .stat-num { font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:#C8956C;line-height:1;min-width:44px; }
    .stat-texto { font-size:12px;font-weight:300;color:rgba(245,240,232,0.5);line-height:1.4; }
    .stat-texto strong { display:block;font-weight:500;color:rgba(245,240,232,0.8);font-size:13px; }

    /* ── Panel derecho ── */
    .adoptados-panel-der {
      flex: 1;
      display: flex; flex-direction: column;
      padding: 52px 48px;
      overflow-y: auto;
    }

    /* Tabs */
    .acceso-tabs { display:flex;gap:0;margin-bottom:40px;border-bottom:1.5px solid rgba(200,149,108,0.2); }
    .acceso-tab { font-family:'DM Sans',sans-serif;font-size:13px;font-weight:400;color:rgba(92,64,51,0.45);text-decoration:none;padding:10px 20px 14px;border-bottom:2px solid transparent;margin-bottom:-1.5px;transition:color 0.2s,border-color 0.2s;cursor:pointer;display:inline-block; }
    .acceso-tab:hover { color:#5C4033; }
    .acceso-tab.activo { color:#C8956C;font-weight:500;border-bottom-color:#C8956C; }

    .adoptados-titulo { font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:#2C1A0E;margin:0 0 6px 0;letter-spacing:-0.01em; }
    .adoptados-subtitulo { font-size:13px;font-weight:300;color:rgba(92,64,51,0.6);margin:0 0 32px 0;line-height:1.5; }

    /* Grid de tarjetas */
    .adoptados-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      flex: 1;
    }

    /* Tarjeta de animal adoptado */
    .tarjeta-adoptado {
      background-color: #FAF7F2;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(200,149,108,0.12);
      box-shadow: 0 2px 8px rgba(80,40,10,0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: aparecer 0.4s ease both;
      text-decoration: none;
      display: block;
    }

    .tarjeta-adoptado:nth-child(1) { animation-delay: 0.05s; }
    .tarjeta-adoptado:nth-child(2) { animation-delay: 0.12s; }
    .tarjeta-adoptado:nth-child(3) { animation-delay: 0.19s; }
    .tarjeta-adoptado:nth-child(4) { animation-delay: 0.26s; }

    @keyframes aparecer {
      from { opacity:0; transform:translateY(16px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .tarjeta-adoptado:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 24px rgba(80,40,10,0.1);
    }

    .tarjeta-adoptado::before {
      content: '';
      display: block;
      height: 4px;
      background: linear-gradient(90deg, #C8956C, #7B9E87);
    }

    .tarjeta-adoptado:nth-child(2n)::before { background: linear-gradient(90deg, #7B9E87, #C8956C); }

    .tarjeta-foto {
      width: 100%; aspect-ratio: 1;
      background-color: #D4B8A0;
      overflow: hidden;
    }

    .tarjeta-foto img { width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.4s ease; }
    .tarjeta-adoptado:hover .tarjeta-foto img { transform: scale(1.05); }

    .tarjeta-info { padding: 14px 16px 18px; }
    .tarjeta-nombre { font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:#2C1A0E;margin:0 0 3px 0; }
    .tarjeta-raza { font-size:11px;font-weight:400;letter-spacing:0.1em;text-transform:uppercase;color:#C8956C;margin:0 0 10px 0; }
    .tarjeta-meta { display:flex;gap:10px; }
    .tarjeta-chip { font-size:11px;font-weight:300;color:rgba(92,64,51,0.6);background:rgba(200,149,108,0.08);padding:3px 8px;border-radius:100px; }

    /* Estado vacío */
    .adoptados-vacio {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; text-align: center;
      padding: 48px 20px;
      color: rgba(92,64,51,0.4);
    }

    .adoptados-vacio .vacio-icono { font-size: 52px; opacity: 0.4; }
    .adoptados-vacio p { font-size: 14px; font-weight: 300; line-height: 1.6; max-width: 280px; }
    .adoptados-vacio a { font-size:13px;font-weight:500;color:#C8956C;text-decoration:none;border-bottom:1px solid rgba(200,149,108,0.3);padding-bottom:2px;transition:border-color 0.2s; }
    .adoptados-vacio a:hover { border-color:#C8956C; }

    /* Responsive */
    @media (max-width: 860px) {
      .pagina-adoptados { flex-direction: column; }
      .adoptados-panel-izq { width:100%;padding:48px 32px 40px;min-height:auto; }
      .adoptados-panel-izq::after { display:none; }
      .adoptados-panel-der { padding:40px 24px; }
    }
  </style>
</head>
<body>

<header id="header"></header>

<main class="pagina-adoptados">

  <!-- Panel izquierdo -->
  <div class="adoptados-panel-izq">
    <p class="panel-tag">Mi familia</p>
    <h1 class="panel-titulo">Vidas que has<br><em>cambiado</em></h1>
    <p class="panel-descripcion">
      Cada adopción es una historia de amor. Aquí puedes ver a todos los animales que ahora forman parte de tu vida.
    </p>
    <div class="panel-stats" id="panelStats">
      <!-- Se rellena con JS -->
      <div class="stat-item">
        <span class="stat-num" id="statNum">—</span>
        <div class="stat-texto">
          <strong>Animales adoptados</strong>
          gracias a ti
        </div>
      </div>
    </div>
  </div>

  <!-- Panel derecho -->
  <div class="adoptados-panel-der">

    <nav class="acceso-tabs">
      <a href="reiniciarContrasena.html" class="acceso-tab">Contraseña</a>
      <a href="perfil.html" class="acceso-tab">Mis Datos</a>
      <span class="acceso-tab activo">Adoptados</span>
    </nav>

    <h2 class="adoptados-titulo">Mis adoptados</h2>
    <p class="adoptados-subtitulo">Todos los animales que has acogido en tu hogar.</p>

    <div id="contenido-adoptados">
      <!-- Se rellena con JS -->
    </div>

  </div>

</main>

<footer id="footer"></footer>

<script>xLuIncludeFile();</script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    loadHTMLAndExecuteScripts('#header', 'components/_header.html');
    loadHTMLAndExecuteScripts('#footer', 'components/_footer.html');

    const usuario = JSON.parse(localStorage.getItem('usuarioLogueado'));
    const contenedor = document.getElementById('contenido-adoptados');

    // Obtener animales adoptados del usuario (ajusta según tu estructura de datos)
    const adoptados = usuario?.animalesAdoptados || usuario?.adoptados || [];

    document.getElementById('statNum').textContent = adoptados.length || '0';

    if (!adoptados.length) {
      contenedor.innerHTML = `
        <div class="adoptados-vacio">
          <div class="vacio-icono">🐾</div>
          <p>Todavía no has adoptado ningún animal.<br>¡Tu hogar está esperando a alguien especial!</p>
          <a href="catalogo.html">Ver animales disponibles →</a>
        </div>`;
      return;
    }

    // Si hay adoptados, los mostramos
    fetch('assets/json/data.json')
            .then(r => r.json())
            .then(data => {
              const grid = document.createElement('div');
              grid.className = 'adoptados-grid';

              adoptados.forEach(id => {
                const animal = data.animales.find(a => a.id == id);
                if (!animal) return;

                grid.innerHTML += `
            <a href="fichaAnimal.html?id=${animal.id}" class="tarjeta-adoptado">
              <div class="tarjeta-foto">
                <img src="${animal.foto1}" alt="${animal.nombre}" loading="lazy">
              </div>
              <div class="tarjeta-info">
                <h3 class="tarjeta-nombre">${animal.nombre}</h3>
                <p class="tarjeta-raza">${animal.raza}</p>
                <div class="tarjeta-meta">
                  <span class="tarjeta-chip">${animal.edad} años</span>
                  <span class="tarjeta-chip">${animal.sexo}</span>
                </div>
              </div>
            </a>`;
              });

              contenedor.appendChild(grid);
            })
            .catch(() => {
              contenedor.innerHTML = '<p style="color:rgba(92,64,51,0.5);font-size:13px;">Error al cargar los datos.</p>';
            });
  });
</script>

</body>
</html>
