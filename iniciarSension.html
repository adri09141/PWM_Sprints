<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/estilos.css">
  <link rel="stylesheet" href="assets/css/pages/acceso.css">
  <script src="assets/js/xlu-include-file.js"></script>
  <script src="assets/js/auth.js"></script>
  <title>Iniciar Sesión — Huellas Felices</title>
</head>

<body>

<header id="header"></header>

<main class="pagina-acceso">

  <!-- Panel izquierdo decorativo -->
  <div class="acceso-panel-izq">
    <p class="panel-tag">Bienvenido de nuevo</p>
    <h1 class="panel-titulo">Cada adopción<br>es un <em>nuevo inicio</em></h1>
    <p class="panel-descripcion">
      Accede a tu cuenta para ver el estado de tus solicitudes, guardar tus favoritos y seguir el proceso de adopción.
    </p>
    <div class="panel-mascotas">
      <div class="mascota-chip"><span>🐕</span> Perros</div>
      <div class="mascota-chip"><span>🐈</span> Gatos</div>
      <div class="mascota-chip"><span>🐾</span> Más</div>
    </div>
  </div>

  <!-- Panel derecho con formulario -->
  <div class="acceso-panel-der">
    <div class="acceso-card">

      <!-- Tabs -->
      <nav class="acceso-tabs">
        <span class="acceso-tab activo">Iniciar Sesión</span>
        <a href="crearCuenta.html" class="acceso-tab">Crear Cuenta</a>
      </nav>

      <h2 class="acceso-titulo">Hola de nuevo</h2>
      <p class="acceso-subtitulo">Introduce tus datos para acceder a tu cuenta.</p>

      <form id="loginForm">

        <div class="campo-grupo">
          <label class="campo-label" for="correo">Correo electrónico</label>
          <div class="campo-wrapper">
            <input class="campo-input" type="email" id="correo" name="correo"
                   required placeholder="ejemplo@gmail.com">
          </div>
        </div>

        <div class="campo-grupo">
          <label class="campo-label" for="contrasena">Contraseña</label>
          <div class="campo-wrapper">
            <input class="campo-input" type="password" id="contrasena" name="contrasena"
                   required
                   placeholder="Mín. 3 letras, 1 número y 1 especial (Ej: Perro1!)"
                   title="Debe tener al menos 3 letras, 1 número y 1 carácter especial">
            <button type="button" id="btn_ver_contrasena" class="btn-ver-pass">Ver</button>
          </div>
        </div>

        <div id="error" class="acceso-error"></div>

        <button type="submit" id="confirmar" class="btn-acceso-principal">
          Entrar
        </button>

      </form>

    </div>
  </div>

</main>

<footer id="footer"></footer>

<script>
  xLuIncludeFile();
  document.addEventListener('DOMContentLoaded', () => {
    loadHTMLAndExecuteScripts('#header', 'components/_header.html');
    loadHTMLAndExecuteScripts('#footer', 'components/_footer.html');
  });
</script>

</body>
</html>
