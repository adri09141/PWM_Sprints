<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil</title>
    <link rel="stylesheet" href="assets/css/estilos.css">
    <link rel="stylesheet" href="assets/css/estilos-acceso.css">
    <style>
        body {
            text-align: center;
        }
        table {
            margin: 0 auto; text-align: left;
        }
        td {
            font: bold 20px verdana, sans-serif;
        }
        textarea{
            font: normal 15px verdana, sans-serif;
            margin: 20px;
            vertical-align: middle;
            resize: none;
        }
    </style>
</head>
<body>
<header xlu-include-file="components/_header.html"></header>
<nav class="main_menu">
    <ul>
        <li>Datos</li>
        <li><a href="adoptados.html" class="enlace-nav">Adoptados</a></li>
    </ul>
</nav>
<table>
    <tr>
        <td>Nombre:</td>
        <td><textarea id="nombre" name="nombre" rows="1" cols="30"></textarea></td>
    </tr>
    <tr>
        <td>Apellidos:</td>
        <td><textarea id="apellidos" name="apellidos" rows="1" cols="30"></textarea></td>
    </tr>
    <tr>
        <td>Fecha de Nacimiento:</td>
        <td><input type="date" id="fecha_nacimiento" name="fecha_nacimiento" style="font-size: 15px; margin-left: 20px;"></td>
    </tr>
    <tr>
        <td>DNI:</td>
        <td><textarea id="dni" name="dni" rows="1" cols="30"></textarea></td>
    </tr>
    <tr>
        <td>Dirección:</td>
        <td><textarea id="direccion" name="direccion" rows="1" cols="30"></textarea></td>
    </tr>
    <tr>
        <td>Teléfono:</td>
        <td><textarea id="telefono" name="telefono" rows="1" cols="30"></textarea></td>
    </tr>
    <tr>
        <td>Correo:</td>
        <td><input type="email" id="correo" name="correo" style="font-size: 14px; margin:20px; width: 280px;"></td>
    </tr>
    <tr>
        <td>Nº de adopciones:</td>
        <td><textarea id="n_adopciones" name="n_adopciones" rows="1" cols="30"></textarea></td>
    </tr>
</table>
<br><input type="button" value="Actualizar" style="font-size: 20px; padding:  15px 30px;" ></br>
<footer xlu-include-file="components/_footer.html"></footer>
<script src="assets/js/xlu-include-file.js"></script>

<script>
    xLuIncludeFile();
</script>
</body>
</html>
